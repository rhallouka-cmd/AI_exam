<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles-i18n.css">
</head>
<body>
    <div class="container">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="nav-brand">Student Management System</div>
            <div class="nav-menu">
                <a href="/" class="nav-link active" data-i18n="nav.students">Students</a>
                <a href="/dashboard" class="nav-link" data-i18n="nav.dashboard">Dashboard</a>
                <a href="/templates" class="nav-link" data-i18n="nav.templates">Templates</a>
                <a href="/exams" class="nav-link" data-i18n="nav.exams">Exams</a>
                <a href="/courses" class="nav-link" data-i18n="nav.courses">Courses</a>
                <a href="/import" class="nav-link" data-i18n="nav.import">Import</a>
                
                <!-- Language Selector -->
                <div class="language-selector"></div>
                
                <button onclick="logout()" class="btn btn-logout" data-i18n="nav.logout">Logout</button>
            </div>
        </nav>

        <main class="main-content">
            <!-- Form Section -->
            <section class="form-section">
                <h2 data-i18n="students.add">Add/Edit Student</h2>
                <form id="studentForm" class="student-form">
                    <div class="form-group">
                        <label for="studentId" data-i18n="students.id">Student ID (Auto-generated)</label>
                        <input type="text" id="studentId" readonly placeholder="Auto-generated" data-i18n="common.autoGenerated" data-i18n-attr="placeholder">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="fullName" data-i18n="students.name">Full Name *</label>
                            <input type="text" id="fullName" required placeholder="Enter student full name" data-i18n="students.enterName" data-i18n-attr="placeholder">
                        </div>
                        <div class="form-group">
                            <label for="age" data-i18n="students.age">Age</label>
                            <input type="number" id="age" min="1" max="100" placeholder="Enter age" data-i18n="students.enterAge" data-i18n-attr="placeholder">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="email" data-i18n="students.email">Email *</label>
                            <input type="email" id="email" required placeholder="Enter email address" data-i18n="students.enterEmail" data-i18n-attr="placeholder">
                        </div>
                        <div class="form-group">
                            <label for="phone" data-i18n="students.phone">Phone Number</label>
                            <input type="tel" id="phone" placeholder="Enter phone number" data-i18n="students.enterPhone" data-i18n-attr="placeholder">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="grade" data-i18n="students.grade">Grade</label>
                            <input type="text" id="grade" placeholder="Enter grade (e.g., A, B, C)" data-i18n="students.enterGrade" data-i18n-attr="placeholder">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="submitBtn" class="btn btn-primary" data-i18n="btn.addStudent">Add Student</button>
                        <button type="button" id="resetBtn" class="btn btn-secondary" data-i18n="btn.clear">Clear</button>
                    </div>
                </form>
            </section>

            <!-- Search and Filter Section -->
            <section class="search-section">
                <h2 data-i18n="students.records">Student Records</h2>
                <div class="search-controls">
                    <input type="text" id="searchInput" placeholder="Search by name, email, or phone..." class="search-box" data-i18n="common.searchPlaceholder" data-i18n-attr="placeholder">
                    <button id="refreshBtn" class="btn btn-refresh" data-i18n="btn.refresh">Refresh</button>
                </div>
            </section>

            <!-- Students Table Section -->
            <section class="table-section">
                <div id="noStudents" class="no-data">
                    <p data-i18n="students.noStudentsMsg">No students found. Add a student to get started!</p>
                </div>
                <table id="studentsTable" class="students-table" style="display: none;">
                    <thead>
                        <tr>
                            <th data-i18n="students.id">ID</th>
                            <th data-i18n="students.name">Full Name</th>
                            <th data-i18n="students.age">Age</th>
                            <th data-i18n="students.email">Email</th>
                            <th data-i18n="students.phone">Phone</th>
                            <th data-i18n="students.grade">Grade</th>
                            <th data-i18n="btn.actions">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTableBody">
                    </tbody>
                </table>
            </section>
        </main>

        <footer class="footer">
            <p>&copy; 2026 <span data-i18n="app.name">Student Management System</span>. <span data-i18n="footer.rights">All rights reserved.</span></p>
        </footer>
    </div>

    <script src="language-selector.js"></script>
    <script src="translations.js"></script>
    <script src="script.js"></script>
</body>
</html>
