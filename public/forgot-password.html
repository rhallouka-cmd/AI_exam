<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Student Management System</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .auth-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }

        .auth-box h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
            font-size: 1.8em;
        }

        .auth-box p {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.95em;
            line-height: 1.5;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .auth-button {
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .auth-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .auth-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .auth-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .auth-link a:hover {
            color: #764ba2;
        }

        .alert {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            border-left: 4px solid;
            font-size: 0.9em;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border-color: #f44336;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border-color: #4caf50;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border-color: #17a2b8;
            word-break: break-all;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            margin-top: 10px;
        }

        @media (max-width: 480px) {
            .auth-box {
                padding: 30px 20px;
            }

            .auth-box h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h1>Forgot Password?</h1>
            <p>Enter your email address and we'll send you a link to reset your password</p>
            
            <div id="alertContainer"></div>

            <form id="forgotPasswordForm" class="auth-form">
                <div class="form-group">
                    <label for="email" data-i18n="auth.email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your registered email" data-i18n="auth.enterEmail" data-i18n-attr="placeholder">
                </div>

                <button type="submit" class="auth-button" data-i18n="auth.resetPassword">Send Reset Link</button>
                <div class="loading" id="loading" data-i18n="msg.loading">Sending reset link...</div>
            </form>

            <div class="auth-link">
                Remember your password? <a href="/login">Login here</a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('forgotPasswordForm');
        const alertContainer = document.getElementById('alertContainer');
        const loadingDiv = document.getElementById('loading');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();

            if (!email) {
                showAlert('Email is required', 'error');
                return;
            }

            loadingDiv.style.display = 'block';

            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (!response.ok) {
                    showAlert(data.error || 'Failed to send reset link', 'error');
                    loadingDiv.style.display = 'none';
                    return;
                }

                // Show the reset link (only for demo - in production this would be sent via email)
                if (data.resetLink) {
                    showAlert(`Reset link: <a href="${data.resetLink}" target="_blank">Click here to reset password</a>`, 'info');
                } else {
                    showAlert('If an account exists with this email, you will receive a reset link', 'success');
                }
                
                loadingDiv.style.display = 'none';
            } catch (error) {
                console.error('Error:', error);
                showAlert('An error occurred. Please try again.', 'error');
                loadingDiv.style.display = 'none';
            }
        });

        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = message;
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alertDiv);

            if (type === 'error') {
                setTimeout(() => {
                    alertDiv.remove();
                }, 5000);
            }
        }

        // Check if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = '/';
        }
    </script>
</body>
</html>
